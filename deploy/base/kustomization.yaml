apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wine-club
labels:
  - pairs:
      app.kubernetes.io/part-of: wine-club
resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml
  - ingress.yaml
  - backup.yaml
configMapGenerator:
  - name: wine-club-config
    literals:
      - ALLOWED_HOSTS=wine-club.example.org
      - CSRF_TRUSTED_ORIGINS=https://wine-club.example.org
      - SECURE_PROXY_SSL=true
      - TIME_ZONE=Australia/Adelaide
      - WEB_CONCURRENCY=2
