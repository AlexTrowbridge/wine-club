apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-club
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wine-club
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wine-club
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Django serialises concurrent migrations with a lock, so running this in
        # every replica is safe at this scale.
        # ensure_admin creates the default superuser on first deploy (if ADMIN_PASSWORD is set).
        - name: migrate
          image: wine-club
          command:
            - sh
            - -c
            - python manage.py migrate --noinput && python manage.py ensure_admin
          envFrom:
            - configMapRef:
                name: wine-club-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wine-club-secrets
                  key: SECRET_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wine-club-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://wineclub:$(POSTGRES_PASSWORD)@postgres:5432/wineclub
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wine-club-secrets
                  key: ADMIN_PASSWORD
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: web
          image: wine-club
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: wine-club-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wine-club-secrets
                  key: SECRET_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wine-club-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://wineclub:$(POSTGRES_PASSWORD)@postgres:5432/wineclub
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wine-club
spec:
  selector:
    app.kubernetes.io/name: wine-club
  ports:
    - name: http
      port: 80
      targetPort: http
