apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
# Nightly logical backup; keeps 30 days of gzipped dumps on the backups volume.
# Restore: gunzip -c <file> | psql -h postgres -U wineclub wineclub
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: pg-dump
              image: docker.io/library/postgres:17
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: wineclub
                - name: PGDATABASE
                  value: wineclub
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wine-club-secrets
                      key: POSTGRES_PASSWORD
                - name: RETENTION_DAYS
                  value: "30"
              command:
                - sh
                - -ec
                - |
                  file=/backups/wineclub-$(date +%Y%m%d-%H%M%S).sql.gz
                  pg_dump --no-owner | gzip > "$file.partial"
                  mv "$file.partial" "$file"
                  find /backups -name 'wineclub-*.sql.gz' -mtime +"$RETENTION_DAYS" -delete
                  ls -lh /backups
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
