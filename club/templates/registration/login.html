{% extends "club/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 40px auto;">
  <h1>Log in</h1>
  {% if form.errors %}<p class="bad">Your username and password didn't match.</p>{% endif %}
  <form method="post" class="form-grid">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p class="small muted"><a href="{% url 'password_reset' %}">Forgotten your password?</a></p>
</div>
{% endblock %}
