{% extends "club/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{% if form.instance.pk %}Edit{% else %}New{% endif %} {{ title|lower }}</h1>
<div class="card">
  <form method="post" class="form-grid">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <div class="btn-row">
      <button type="submit">Save</button>
      <a class="btn secondary" href="{% if form.instance.pk %}{{ form.instance.get_absolute_url }}{% else %}{% url 'session_list' %}{% endif %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
