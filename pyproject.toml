[project]
name = "wine-club"
version = "0.3.0"
description = "Web app for tracking the institute wine club: members, sessions, wines and scores."
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "whitenoise>=6.9",
    "openpyxl>=3.1",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["club/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
